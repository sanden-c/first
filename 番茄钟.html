<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄钟</title>
<style>
  :root {
    --work: #e74c3c;
    --break: #2ecc71;
    --bg: #1a1a2e;
    --card: #16213e;
    --text: #eee;
    --muted: #8892b0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    user-select: none;
  }

  .container {
    text-align: center;
    padding: 2rem;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    margin-bottom: 2rem;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  /* 模式切换 */
  .tabs {
    display: flex;
    background: var(--card);
    border-radius: 999px;
    padding: 4px;
    margin-bottom: 2rem;
    gap: 4px;
  }

  .tab {
    flex: 1;
    padding: 10px 24px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.3s;
    font-weight: 500;
  }

  .tab.active {
    background: var(--work);
    color: #fff;
  }

  .tab.break-active.active {
    background: var(--break);
  }

  /* 计时器圆圈 */
  .timer-ring {
    position: relative;
    width: 280px;
    height: 280px;
    margin: 0 auto 2rem;
  }

  svg {
    transform: rotate(-90deg);
  }

  .ring-bg {
    fill: none;
    stroke: var(--card);
    stroke-width: 8;
  }

  .ring-progress {
    fill: none;
    stroke: var(--work);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.3s linear;
  }

  .ring-progress.break-color {
    stroke: var(--break);
  }

  .timer-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .time {
    font-size: 4.5rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    font-variant-numeric: tabular-nums;
    font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  }

  .label {
    font-size: 0.9rem;
    color: var(--muted);
    margin-top: 4px;
  }

  /* 按钮 */
  .buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 2rem;
  }

  .btn {
    padding: 12px 36px;
    border: none;
    border-radius: 999px;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }

  .btn:active { transform: scale(0.96); }

  .btn-start {
    background: var(--work);
    color: #fff;
    min-width: 140px;
  }
  .btn-start:hover { filter: brightness(1.1); }
  .btn-start.break-mode { background: var(--break); }

  .btn-reset {
    background: transparent;
    color: var(--muted);
    border: 2px solid var(--muted);
  }
  .btn-reset:hover { color: #fff; border-color: #fff; }

  /* 统计 */
  .stats {
    display: flex;
    gap: 32px;
    justify-content: center;
    font-size: 0.9rem;
    color: var(--muted);
  }

  .stats span {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text);
    display: block;
  }

  /* 完成闪动 */
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .finished .time { animation: pulse 0.8s infinite; }
</style>
</head>
<body>

<div class="container">
  <h1>🍅 番茄钟</h1>

  <div class="tabs">
    <button class="tab active" data-mode="work">专注</button>
    <button class="tab" data-mode="break">休息</button>
  </div>

  <div class="timer-ring" id="timerRing">
    <svg width="280" height="280" viewBox="0 0 280 280">
      <circle class="ring-bg" cx="140" cy="140" r="126"/>
      <circle class="ring-progress" id="ringProgress" cx="140" cy="140" r="126"
              stroke-dasharray="791.68" stroke-dashoffset="0"/>
    </svg>
    <div class="timer-text">
      <div class="time" id="timeDisplay">25:00</div>
      <div class="label" id="modeLabel">专注中</div>
    </div>
  </div>

  <div class="buttons">
    <button class="btn btn-start" id="btnStart" onclick="toggleTimer()">开始</button>
    <button class="btn btn-reset" onclick="resetTimer()">重置</button>
  </div>

  <div class="stats">
    <div>🍅 完成<span id="sessionCount">0</span></div>
    <div>📅 今日<span id="todayCount">0</span></div>
  </div>
</div>

<script>
  const WORK_TIME = 25 * 60;
  const BREAK_TIME = 5 * 60;
  const CIRCUMFERENCE = 2 * Math.PI * 126; // ~791.68

  let mode = 'work';
  let seconds = WORK_TIME;
  let timerId = null;
  let isRunning = false;
  let sessionCount = parseInt(localStorage.getItem('pomodoro_sessions') || '0');
  let todayCount = parseInt(localStorage.getItem('pomodoro_today') || '0');
  let todayDate = localStorage.getItem('pomodoro_date') || '';

  // 检查是否新的一天
  const today = new Date().toDateString();
  if (todayDate !== today) {
    todayCount = 0;
    todayDate = today;
    localStorage.setItem('pomodoro_date', todayDate);
    localStorage.setItem('pomodoro_today', '0');
  }

  const el = {
    time: document.getElementById('timeDisplay'),
    modeLabel: document.getElementById('modeLabel'),
    ring: document.getElementById('ringProgress'),
    btnStart: document.getElementById('btnStart'),
    timerRing: document.getElementById('timerRing'),
    sessionCount: document.getElementById('sessionCount'),
    todayCount: document.getElementById('todayCount'),
    tabs: document.querySelectorAll('.tab'),
  };

  function formatTime(s) {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const sec = (s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }

  function updateDisplay() {
    el.time.textContent = formatTime(seconds);
    const total = mode === 'work' ? WORK_TIME : BREAK_TIME;
    const progress = (total - seconds) / total;
    el.ring.style.strokeDashoffset = CIRCUMFERENCE * progress;

    el.sessionCount.textContent = sessionCount;
    el.todayCount.textContent = todayCount;
  }

  function switchMode(newMode) {
    mode = newMode;
    seconds = mode === 'work' ? WORK_TIME : BREAK_TIME;
    el.modeLabel.textContent = mode === 'work' ? '专注中' : '休息中';

    // 更新标签
    el.tabs.forEach(t => {
      t.classList.toggle('active', t.dataset.mode === mode);
      t.classList.toggle('break-active', mode === 'break');
    });

    // 更新按钮/进度环颜色
    el.ring.style.strokeDashoffset = 0;
    el.ring.classList.toggle('break-color', mode === 'break');
    el.btnStart.classList.toggle('break-mode', mode === 'break');
    el.timerRing.classList.remove('finished');

    updateDisplay();
  }

  function toggleTimer() {
    if (isRunning) {
      pauseTimer();
    } else {
      startTimer();
    }
  }

  function startTimer() {
    isRunning = true;
    el.btnStart.textContent = '暂停';
    el.timerRing.classList.remove('finished');

    timerId = setInterval(() => {
      seconds--;
      updateDisplay();

      if (seconds <= 0) {
        clearInterval(timerId);
        isRunning = false;
        timerComplete();
      }
    }, 1000);
  }

  function pauseTimer() {
    isRunning = false;
    clearInterval(timerId);
    el.btnStart.textContent = '继续';
  }

  function resetTimer() {
    pauseTimer();
    seconds = mode === 'work' ? WORK_TIME : BREAK_TIME;
    el.btnStart.textContent = '开始';
    el.ring.style.strokeDashoffset = 0;
    el.timerRing.classList.remove('finished');
    updateDisplay();
  }

  function timerComplete() {
    el.timerRing.classList.add('finished');
    el.btnStart.textContent = '开始';
    playSound();

    if (mode === 'work') {
      sessionCount++;
      todayCount++;
      localStorage.setItem('pomodoro_sessions', sessionCount);
      localStorage.setItem('pomodoro_today', todayCount);
      updateDisplay();
      switchMode('break');
    } else {
      switchMode('work');
    }
  }

  function playSound() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    // 三段式提示音：叮-叮-叮↑
    [0, 0.15, 0.3].forEach((delay, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.type = 'sine';
      osc.frequency.value = 660 + i * 220;
      gain.gain.setValueAtTime(0.3, ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.3);

      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + 0.3);
    });

    // 通知弹窗
    if (Notification.permission === 'granted') {
      new Notification('番茄钟', {
        body: mode === 'work' ? '专注完成！休息一下吧 🎉' : '休息结束，开始新一轮专注！',
        icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🍅</text></svg>'
      });
    }
  }

  // 请求通知权限
  if (Notification.permission === 'default') {
    Notification.requestPermission();
  }

  // 标签切换
  el.tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      pauseTimer();
      el.btnStart.textContent = '开始';
      switchMode(tab.dataset.mode);
    });
  });

  // 键盘快捷键
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      toggleTimer();
    }
    if (e.code === 'KeyR') {
      resetTimer();
    }
  });

  // 初始显示
  updateDisplay();
</script>

</body>
</html>
